server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    # Cabeçalhos de segurança do frontend (o helmet cuida das respostas da API).
    # Atenção: um add_header dentro de um "location" apaga estes; por isso os locations abaixo usam só "expires".
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome (gerados pelo Vite): cache longo.
    location /assets/ {
        expires 1y;
    }

    # SPA: rotas como /aceitar-convite/... caem no index.html, que nunca fica em cache.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
